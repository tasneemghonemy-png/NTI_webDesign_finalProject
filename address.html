<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>

    <!--fontawesome-->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- bootstrap style -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">

    <!-- my style -->
    <link rel="stylesheet" href="css/account.css">

</head>

<body>

    <div class="py-4 py-md-5 text-center">

        <h1 class="fw-bold display-5">My Account</h1>

    </div>


    <div class="container my-5">

        <div class="row g-4 align-items-start">

            <!-- Profile -->

            <div class="col-12 col-md-4 card border-0 bg-light p-3">

                <div class="card-body text-center">

                    <div class="position-relative avatar mx-auto mb-3">

                        <i id="profileIcon"
                            class="fa-duotone fa-solid fa-circle-user fa-6x position-absolute top-50 start-50 translate-middle opacity-25">
                        </i>

                        <img class="rounded-circle d-none" id="profileImage">

                        <label for="profilePic"
                            class="position-absolute bottom-0 end-0 bg-white rounded-circle border border-2 border-white p-0 d-flex align-items-center justify-content-center pic">

                            <i class="fa-sharp fa-solid fa-circle-plus opacity-100 fs-4"></i>

                        </label>

                    </div>


                    <h5 class="fw-bold mb-4" id="sliderName">
                        Sofia Havertz
                    </h5>

                    <input type="file" class="d-none" id="profilePic">


                    <!-- mobile menu -->

                    <div class="d-md-none mb-3">

                        <select id="accountMenu" class="form-select fw-semibold">

                            <option value="account">Account</option>

                            <option value="address" selected>Address</option>

                            <option value="orders">Orders</option>

                            <option value="wishlist">Wishlist</option>

                        </select>

                    </div>


                    <!-- large screen menu -->

                    <ul class="list-unstyled text-start d-none d-md-block m-0">

                        <li class="py-2">

                            <a href="account.html"
                                class="text-decoration-none text-secondary">
                                Account
                            </a>

                        </li>

                        <li class="py-2 border-bottom fw-bold">

                            <a href="address.html"
                                class="text-decoration-none text-dark">
                                Address
                            </a>

                        </li>

                        <li class="py-2">

                            <a href="orders.html"
                                class="text-decoration-none text-secondary">
                                Orders
                            </a>

                        </li>

                        <li class="py-2">

                            <a href="wishlist.html"
                                class="text-decoration-none text-secondary">
                                Wishlist
                            </a>

                        </li>

                        <li class="py-2">

                            <a href="#"
                                class="text-decoration-none text-secondary">
                                Log Out
                            </a>

                        </li>

                    </ul>

                </div>

            </div>



            <!-- Address Details -->

            <div class="col-12 col-md-8">

                <div class="card border-0">

                    <div class="card-body p-0 ps-md-3">

                        <h3 class="mb-4 fw-bold">
                            Address
                        </h3>


                        <div class="row g-4">

                            <!-- Billing Address Card -->

                            <div class="col-12 col-lg-6">

                                <div class="border rounded-3 p-3 bg-white h-100">

                                    <div class="d-flex justify-content-between align-items-center mb-3">

                                        <h6 class="fw-bold m-0">
                                            Billing Address
                                        </h6>

                                        <a href="#"
                                            class="text-decoration-none text-secondary small">

                                            <i class="fa-solid fa-pen fs-6 me-1"></i>Edit

                                        </a>

                                    </div>


                                    <p class="mb-1 text-dark small fw-semibold">
                                        Sofia Havertz
                                    </p>

                                    <p class="mb-1 text-secondary small">
                                        (+1) 234 567 890
                                    </p>

                                    <p class="mb-0 text-secondary small">
                                        345 Long Island, NewYork, United States
                                    </p>

                                </div>

                            </div>



                            <!-- Shipping Address Card -->

                            <div class="col-12 col-lg-6">

                                <div class="border rounded-3 p-3 bg-white h-100">

                                    <div class="d-flex justify-content-between align-items-center mb-3">

                                        <h6 class="fw-bold m-0">
                                            Shipping Address
                                        </h6>

                                        <a href="#"
                                            class="text-decoration-none text-secondary small">

                                            <i class="fa-solid fa-pen fs-6 me-1"></i>Edit

                                        </a>

                                    </div>


                                    <p class="mb-1 text-dark small fw-semibold">
                                        Sofia Havertz
                                    </p>

                                    <p class="mb-1 text-secondary small">
                                        (+1) 234 567 890
                                    </p>

                                    <p class="mb-0 text-secondary small">
                                        345 Long Island, NewYork, United States
                                    </p>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>



    <!-- bootstrap js -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
    </script>


    <!-- my js -->

    <script src="js/script.js"></script>

</body>

</html>
